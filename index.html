<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Capacitación — Cedro</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header">
  <h1 class="site-title">Portal de Capacitación</h1>
</header>

<section class="access-gate" id="access-gate">
  <form class="access-form" id="access-form">
    <h2 class="gate-title">Ingresá tus datos para acceder</h2>
    <label class="gate-field">
      <span>Nombre</span>
      <input type="text" name="nombre" required>
    </label>
    <label class="gate-field">
      <span>Email</span>
      <input type="email" name="email" required>
    </label>
    <label class="gate-field">
      <span>Jefatura</span>
      <input type="text" name="jefatura" required>
    </label>
    <label class="gate-field">
      <span>WhatsApp</span>
      <input type="tel" name="whatsapp" required>
    </label>
    <button type="submit" class="gate-submit">Ingresar</button>
    <p class="gate-feedback" id="gate-feedback"></p>
  </form>
</section>

<main class="module-list" id="module-list" hidden>
  <!-- Renderizado por JS desde assets/js/modules-data.js -->
</main>

<template id="module-card-template">
  <article class="module-card">
    <h2 class="module-title"></h2>
    <div class="video-embed">
      <iframe src="" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
  </article>
</template>

<script src="assets/js/modules-data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/access-gate.js"></script>
</body>
</html>
